name: SubCheck

options:
  bundleIdPrefix: github.com-ViniciusMicarelli
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: pt-BR

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5X7S9ZSCA8
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:

  SubCheck:
    type: application
    platform: iOS
    sources:
      - path: SubCheck
    # Info.plist gerado pelo XcodeGen: precisa existir para declarar o esquema
    # de URL `subcheck://` (links dos widgets) e o uso do Face ID.
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: SubCheck
        CFBundleDevelopmentRegion: pt-BR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Use o Face ID para proteger suas assinaturas."
        CFBundleURLTypes:
          - CFBundleURLName: github.com-ViniciusMicarelli.SubCheck
            CFBundleURLSchemes:
              - subcheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: github.com-ViniciusMicarelli.SubCheck
        PRODUCT_NAME: SubCheck
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Config/SubCheck.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: SubCheckWidgets
        embed: true

  SubCheckWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SubCheckWidgets
      - path: SubCheck/BrandIcons.xcassets
      # Tabelas de idioma: copiadas como pastas para o bundle do widget.
      - path: SubCheck/en.lproj
        buildPhase: resources
      - path: SubCheck/pt-BR.lproj
        buildPhase: resources
      # Shared code compiled into both targets.
      - path: SubCheck/models
      - path: SubCheck/Services/SharedModelContainer.swift
      - path: SubCheck/Services/RemoteIconStore.swift
      - path: SubCheck/Services/Localization.swift
      - path: SubCheck/Services/CurrencyService.swift
      - path: SubCheck/Services/WidgetLink.swift
      - path: SubCheck/DesignSystem/Theme.swift
      - path: SubCheck/DesignSystem/CategoryStyle.swift
      - path: SubCheck/DesignSystem/Formatters.swift
      - path: SubCheck/DesignSystem/SubscriptionIconView.swift
      - path: SubCheck/Color.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: github.com-ViniciusMicarelli.SubCheck.widgets
        PRODUCT_NAME: SubCheckWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: SubCheckWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/SubCheckWidgets.entitlements
        SKIP_INSTALL: "YES"

schemes:
  SubCheck:
    build:
      targets:
        SubCheck: all
    run:
      config: Debug
      # Permite comprar/testar o Pro no simulador sem App Store Connect.
      storeKitConfiguration: Config/SubCheck.storekit
    archive:
      config: Release
